<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>OppaiDex</title>
</head>
<body>
    <div id="OppaiDexConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="OppaiDexConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="ApiUrlTemplate">API-URL-Vorlage</label>
                        <input id="ApiUrlTemplate" name="ApiUrlTemplate" type="text" is="emby-input" />
                        <div class="fieldDescription">
                            Die Kennung der Mediendatei ersetzt den Platzhalter {id}.
                        </div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var OppaiDexConfig = {
                pluginUniqueId: 'fda53ad2-6d13-42e4-a501-a6d4514e74fc'
            };

            document.querySelector('#OppaiDexConfigPage')
                .addEventListener('pageshow', function() {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(OppaiDexConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#ApiUrlTemplate').value = config.ApiUrlTemplate;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#OppaiDexConfigForm')
                .addEventListener('submit', function(e) {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(OppaiDexConfig.pluginUniqueId).then(function (config) {
                    config.ApiUrlTemplate = document.querySelector('#ApiUrlTemplate').value;
                    ApiClient.updatePluginConfiguration(OppaiDexConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });

                e.preventDefault();
                return false;
            });
        </script>
    </div>
</body>
</html>
