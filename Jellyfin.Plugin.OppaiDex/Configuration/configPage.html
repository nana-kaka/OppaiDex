<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OppaiDex</title>
</head>
<body>
    <div id="OppaiDexConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="OppaiDexConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="R18ApiUrlTemplate">R18.dev API URL template</label>
                        <input id="R18ApiUrlTemplate" name="R18ApiUrlTemplate" type="text" is="emby-input" required />
                        <div class="fieldDescription">
                            The media file identifier replaces the {id} placeholder.
                        </div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="R18RequestDelayMilliseconds">R18.dev request delay (milliseconds)</label>
                        <input id="R18RequestDelayMilliseconds" name="R18RequestDelayMilliseconds" type="number" min="0" max="60000" step="100" is="emby-input" required />
                        <div class="fieldDescription">
                            Minimum delay between API requests. Increase this value if R18.dev returns HTTP 429 responses.
                        </div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="WarashiEnabled" name="WarashiEnabled" type="checkbox" is="emby-checkbox" />
                            <span>Enable WAPdB person metadata</span>
                        </label>
                        <div class="fieldDescription">
                            Adds higher-resolution portraits, birth dates, and birthplaces for performers.
                        </div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="WarashiBaseUrl">WAPdB base URL</label>
                        <input id="WarashiBaseUrl" name="WarashiBaseUrl" type="text" is="emby-input" required />
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            const OppaiDexConfig = {
                pluginUniqueId: 'fda53ad2-6d13-42e4-a501-a6d4514e74fc'
            };

            document.querySelector('#OppaiDexConfigPage')
                .addEventListener('pageshow', function() {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(OppaiDexConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#R18ApiUrlTemplate').value = config.R18ApiUrlTemplate;
                        document.querySelector('#R18RequestDelayMilliseconds').value =
                            config.R18RequestDelayMilliseconds ?? 1000;
                        document.querySelector('#WarashiEnabled').checked = config.WarashiEnabled;
                        document.querySelector('#WarashiBaseUrl').value = config.WarashiBaseUrl;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#OppaiDexConfigForm')
                .addEventListener('submit', function(e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(OppaiDexConfig.pluginUniqueId).then(function (config) {
                        config.R18ApiUrlTemplate = document.querySelector('#R18ApiUrlTemplate').value;
                        config.R18RequestDelayMilliseconds = Number(
                            document.querySelector('#R18RequestDelayMilliseconds').value);
                        config.WarashiEnabled = document.querySelector('#WarashiEnabled').checked;
                        config.WarashiBaseUrl = document.querySelector('#WarashiBaseUrl').value;
                        ApiClient.updatePluginConfiguration(OppaiDexConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
