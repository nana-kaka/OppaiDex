name: '🚀 Publish Plugin'

on:
  release:
    types:
      - released

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must use the format vMAJOR.MINOR.PATCH."
            exit 1
          fi

          release_version="${BASH_REMATCH[1]}"
          yaml_version="$(sed -nE 's/^version:[[:space:]]*"([^"]+)".*/\1/p' build.yaml)"
          project_version="$(sed -nE 's/.*<Version>([^<]+)<\/Version>.*/\1/p' Directory.Build.props)"
          assembly_version="$(sed -nE 's/.*<AssemblyVersion>([^<]+)<\/AssemblyVersion>.*/\1/p' Directory.Build.props)"
          file_version="$(sed -nE 's/.*<FileVersion>([^<]+)<\/FileVersion>.*/\1/p' Directory.Build.props)"
          expected_binary_version="${release_version}.0"

          failed=false

          if [[ "$yaml_version" != "$release_version" ]]; then
            echo "::error file=build.yaml::Version '$yaml_version' does not match release tag '$RELEASE_TAG'."
            failed=true
          fi

          if [[ "$project_version" != "$release_version" ]]; then
            echo "::error file=Directory.Build.props::Version '$project_version' does not match release tag '$RELEASE_TAG'."
            failed=true
          fi

          if [[ "$assembly_version" != "$expected_binary_version" ]]; then
            echo "::error file=Directory.Build.props::AssemblyVersion '$assembly_version' must be '$expected_binary_version'."
            failed=true
          fi

          if [[ "$file_version" != "$expected_binary_version" ]]; then
            echo "::error file=Directory.Build.props::FileVersion '$file_version' must be '$expected_binary_version'."
            failed=true
          fi

          if [[ "$failed" == true ]]; then
            exit 1
          fi

          echo "Release metadata matches $RELEASE_TAG."

  build:
    needs:
      - validate-release
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master
    with:
      dotnet-version: '9.0.x'
      dotnet-target: 'net9.0'

  upload:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact

      - name: Create checksums
        shell: bash
        run: |
          shopt -s nullglob
          files=(*.zip)
          if (( ${#files[@]} == 0 )); then
            echo 'No plugin ZIP was produced.'
            exit 1
          fi

          for file in "${files[@]}"; do
            md5sum "$file" > "${file%.zip}.md5"
            sha256sum "$file" > "${file%.zip}.sha256"
          done

      - name: Upload GitHub release assets
        uses: shogo82148/actions-upload-release-asset@ee2ae851dc5d938b90075b3ef12c540abfd1ee72 # v1.10.1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: './*'

  manifest:
    needs:
      - upload
    uses: ./.github/workflows/update-manifest.yaml
    secrets: inherit
