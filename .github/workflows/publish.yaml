name: '🚀 Publish Plugin'

on:
  release:
    types:
      - released

permissions:
  contents: write

jobs:
  build:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master
    with:
      dotnet-version: '9.0.x'
      dotnet-target: 'net9.0'

  upload:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact

      - name: Create checksums
        shell: bash
        run: |
          shopt -s nullglob
          files=(*.zip)
          if (( ${#files[@]} == 0 )); then
            echo 'No plugin ZIP was produced.'
            exit 1
          fi

          for file in "${files[@]}"; do
            md5sum "$file" > "${file%.zip}.md5"
            sha256sum "$file" > "${file%.zip}.sha256"
          done

      - name: Upload GitHub release assets
        uses: shogo82148/actions-upload-release-asset@ee2ae851dc5d938b90075b3ef12c540abfd1ee72 # v1.10.1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: './*'

  manifest:
    needs:
      - upload
    uses: ./.github/workflows/update-manifest.yaml
    secrets: inherit
